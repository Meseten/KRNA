[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "krna"
version = "1.0.0"
description = "Kawayan Rhizome Network Algorithm (SKROA) - A Biphasic Continuous Optimization Framework"
authors = [{name = "Lead KRNA Architect"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0"
]

[project.scripts]
# This line tells Linux to map the terminal command 'krna' to our CLI entrypoint
krna = "krna.cli:main"

[tool.setuptools.packages.find]
include = ["krna*"]